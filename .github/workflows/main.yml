name: Gerar APK da Kiri

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/debug/app-debug.apk Kiri.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kiri-apk
          path: Kiri.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kiri versão ${{ github.run_number }}
          body: Baixe o arquivo Kiri.apk abaixo e instale no Android.
          files: Kiri.apk
